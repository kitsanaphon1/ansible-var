- hosts: all
  become: true
  tasks:
    - name: "🐾 ตรวจว่าโฟลเดอร์ docker มีอยู่บน Jenkins"
      local_action: stat path="{{ playbook_dir }}/../docker/"
      register: docker_path_check

    - name: "🛑 Fail ถ้าไม่พบโฟลเดอร์ docker/"
      fail:
        msg: "❌ ไม่พบโฟลเดอร์ docker/ ที่ {{ playbook_dir }}/../docker/"
      when: not docker_path_check.stat.exists

    - name: "📁 สร้างโฟลเดอร์ /home/azureuser/docker บน VM"
      file:
        path: /home/azureuser/docker
        state: directory
        mode: '0755'

    - name: "📦 Copy โปรเจกต์ Api ไปยัง VM"
      copy:
        src: "{{ playbook_dir }}/../docker/Api/"
        dest: /home/azureuser/docker/Api/
        mode: preserve
      delegate_to: localhost

    - name: "📦 Copy โปรเจกต์ WebAppProject ไปยัง VM"
      copy:
        src: "{{ playbook_dir }}/../docker/WebAppProject/"
        dest: /home/azureuser/docker/WebAppProject/
        mode: preserve
      delegate_to: localhost

    - name: "🧾 แสดงรายการไฟล์ที่ถูก copy ไปยัง VM"
      shell: ls -lah /home/azureuser/docker/
      register: copied_content

    - name: "📋 แสดงผลลัพธ์ ls จาก VM"
      debug:
        var: copied_content.stdout_lines

    - name: "📂 ตรวจสอบว่าโฟลเดอร์ Api มีอยู่จริงบน VM"
      stat:
        path: /home/azureuser/docker/Api
      register: api_path

    - name: "🛑 Fail ถ้าไม่พบ /docker/Api บน VM"
      fail:
        msg: "❌ ไม่พบ /home/azureuser/docker/Api บน VM"
      when: not api_path.stat.exists

    - name: "🐳 Build Docker image: Api"
      shell: docker build -t webapi:latest /home/azureuser/docker/Api

    - name: "🐳 Build Docker image: WebAppProject"
      shell: docker build -t webapp:latest /home/azureuser/docker/WebAppProject
