- name: Create Ubuntu 20.04 VM (config-driven)
  hosts: localhost
  connection: local
  gather_facts: no

  vars_files:
    - ../config/config-dev.yaml

  tasks:
    - name: Ensure resource group exists
      azure_rm_resourcegroup:
        name: "{{ resource_group }}"
        location: "{{ location }}"
        state: present
        auth_source: env

    - name: Create virtual network
      azure_rm_virtualnetwork:
        name: "{{ vnet_name }}"
        resource_group: "{{ resource_group }}"
        address_prefixes: "10.10.0.0/16"
        location: "{{ location }}"
        state: present
        auth_source: env

    - name: Create subnet
      azure_rm_subnet:
        name: "{{ subnet_name }}"
        resource_group: "{{ resource_group }}"
        virtual_network: "{{ vnet_name }}"
        address_prefix: "10.10.1.0/24"
        state: present
        auth_source: env

    - name: Create public IP
      azure_rm_publicipaddress:
        name: "{{ pip_name }}"
        resource_group: "{{ resource_group }}"
        allocation_method: Static
        state: present
        auth_source: env

    - name: Create NIC
      azure_rm_networkinterface:
        name: "{{ nic_name }}"
        resource_group: "{{ resource_group }}"
        virtual_network: "{{ vnet_name }}"
        subnet: "{{ subnet_name }}"
        public_ip_name: "{{ pip_name }}"
        state: present
        auth_source: env

    - name: Create Ubuntu VM
      azure_rm_virtualmachine:
        name: "{{ vm_name }}"
        resource_group: "{{ resource_group }}"
        location: "{{ location }}"
        vm_size: "{{ vm_size }}"
        admin_username: "{{ admin_username }}"
        ssh_password_enabled: false
        managed_disk_type: Standard_LRS
        network_interfaces: "{{ nic_name }}"
        image:
          offer: 0001-com-ubuntu-server-focal
          publisher: Canonical
          sku: 20_04-lts
          version: latest
        state: present
        auth_source: env
