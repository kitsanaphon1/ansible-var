- name: "🛡 สแกน image: webapi:latest (ไม่หยุด pipeline แม้เจอช่องโหว่)"
  shell: trivy image --severity CRITICAL,HIGH webapi:latest || true
  register: webapi_scan

- name: "📋 แสดงผลลัพธ์ Trivy ของ webapi"
  debug:
    var: webapi_scan.stdout_lines

- name: "🛡 สแกน image: webapp:latest (ไม่หยุด pipeline แม้เจอช่องโหว่)"
  shell: trivy image --severity CRITICAL,HIGH webapp:latest || true
  register: webapp_scan

- name: "📋 แสดงผลลัพธ์ Trivy ของ webapp"
  debug:
    var: webapp_scan.stdout_lines
